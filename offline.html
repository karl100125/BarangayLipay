        body{

        .offline-box{

        .offline-icon svg{
            width:34px;height:34px;stroke:#e74c3c;fill:none;
            stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
        }
        .offline-box h1{font-size:26px;font-weight:800;margin-bottom:12px}
        .offline-box p{color:rgba(255,255,255,.6);font-size:14px;line-height:1.7;margin-bottom:28px}
        .offline-btn{
            display:inline-block;background:linear-gradient(135deg,#c0392b,#e74c3c);
            color:#fff;font-size:14px;font-weight:700;padding:12px 28px;
            border-radius:10px;text-decoration:none;transition:.2s;
        }
        .offline-btn:hover{opacity:.9;transform:translateY(-2px)}
